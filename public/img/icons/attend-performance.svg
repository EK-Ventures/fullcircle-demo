<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="17.964 17.964 92.073 92.073"
  role="img"
  aria-labelledby="title desc"
  fill="none"
  style="color:#C89B5B">
  <title id="title">Attend a performance icon</title>
  <desc id="desc">A clean circular icon with a proscenium arch, representing attending a live performance.</desc>

  <g
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke">

    <!-- Outer ring -->
    <circle cx="64" cy="64" r="38"/>

    <!-- Proscenium arch -->
    <path d="M50 84 L50 62 A14 14 0 0 1 78 62 L78 84" />

    <!-- Stage line -->
    <path d="M46 84 L82 84" />
  </g>
</svg>
