<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="17.964 17.964 92.073 92.073"
  role="img"
  aria-labelledby="title desc"
  fill="none"
  style="color:#C89B5B">
  <title id="title">Partner with us icon</title>
  <desc id="desc">A clean circular icon with two interlocking links, representing partnership.</desc>

  <g
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke">

    <!-- Outer ring -->
    <circle cx="64" cy="64" r="38"/>

    <!-- Interlocking links -->
    <rect x="44" y="52" width="24" height="16" rx="8" transform="rotate(-20 56 60)"/>
    <rect x="52" y="60" width="24" height="16" rx="8" transform="rotate(-20 72 68)"/>
  </g>
</svg>
