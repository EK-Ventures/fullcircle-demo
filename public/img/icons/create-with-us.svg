<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="17.964 17.964 92.073 92.073"
  role="img"
  aria-labelledby="title desc"
  fill="none"
  style="color:#C89B5B">
  <title id="title">Create with us icon</title>
  <desc id="desc">A clean circular icon with two overlapping circles, representing creative collaboration.</desc>

  <g
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke">

    <!-- Outer ring -->
    <circle cx="64" cy="64" r="38"/>

    <!-- Overlapping collaboration circles -->
    <circle cx="56" cy="64" r="13"/>
    <circle cx="72" cy="64" r="13"/>
  </g>
</svg>
