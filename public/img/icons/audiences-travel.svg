<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="13.382 13.382 101.236 101.236"
  role="img"
  aria-labelledby="title desc"
  fill="none"
  style="color:#C89B5B">
  <title id="title">Audiences travel to experience icon</title>
  <desc id="desc">A clean globe icon representing international audiences travelling to experience Full Circle Theatre.</desc>

  <g
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke">

    <!-- Outer globe -->
    <circle cx="64" cy="64" r="42"/>

    <!-- Central meridian -->
    <path d="M64 22v84"/>

    <!-- Curved meridians -->
    <path d="M64 22
             C49 34 42 48 42 64
             C42 80 49 94 64 106"/>

    <path d="M64 22
             C79 34 86 48 86 64
             C86 80 79 94 64 106"/>

    <!-- Equator -->
    <path d="M22 64h84"/>

    <!-- Upper latitude -->
    <path d="M29 43
             C39 48 51 50 64 50
             C77 50 89 48 99 43"/>

    <!-- Lower latitude -->
    <path d="M29 85
             C39 80 51 78 64 78
             C77 78 89 80 99 85"/>
  </g>
</svg>
